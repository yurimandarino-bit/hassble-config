Devices:
- id: "obd_vehicle"
  name: "CLA 250"
  source: "obd"
  obd:
    mac: "D2:E0:2F:8D:5F:D9"
    service_uuid: "18F0"
    tx_char_uuid: "2AF1"
    rx_char_uuid: "2AF0"
    init_commands:
    - "ATZ"
    - "ATE0"
    - "ATL0"
    - "ATS0"
    - "ATH0"
    - "ATSP7"
  sensors:
  - key: "actual_torque"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    preset: "actual_torque"
    pid: "62"
    formula: "a-125"
  - key: "ambient_temp"
    device_class: "temperature"
    unit: "°C"
    state_class: "measurement"
    accuracy_decimals: 1
    preset: "ambient_temp"
    pid: "46"
    formula: "a-40"
    update_interval: "10s"
  - key: "battery_voltage"
    device_class: "voltage"
    unit: "V"
    state_class: "measurement"
    accuracy_decimals: 2
    preset: "battery_voltage"
    pid: "42"
    formula: "(a*256+b)/1000"
  - key: "coolant_temp"
    device_class: "temperature"
    unit: "°C"
    state_class: "measurement"
    icon: "mdi:coolant-temperature"
    accuracy_decimals: 1
    preset: "coolant_temp"
    pid: "05"
    formula: "a-40"
    update_interval: "10s"
  - key: "engine_load"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:engine"
    accuracy_decimals: 1
    preset: "engine_load"
    pid: "04"
    formula: "a/2.55"
  - key: "rpm"
    unit: "rpm"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    preset: "rpm"
    pid: "0C"
    formula: "(a*256+b)/4"
    update_interval: "1s"
  - key: "run_time"
    device_class: "duration"
    unit: "s"
    state_class: "total_increasing"
    accuracy_decimals: 0
    preset: "run_time"
    pid: "1F"
    formula: "a*256+b"
  - key: "speed"
    device_class: "speed"
    unit: "km/h"
    state_class: "measurement"
    icon: "mdi:speedometer"
    accuracy_decimals: 0
    preset: "speed"
    pid: "0D"
    formula: "a"
    update_interval: "1s"
  - key: "throttle"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 1
    preset: "throttle"
    pid: "11"
    formula: "a/2.55"
    update_interval: "1s"
  - key: "fuel_trim_short"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:fuel"
    accuracy_decimals: 1
    pid: "06"
    formula: "(a-128)*100/128"
    update_interval: "5s"
  - key: "fuel_trim_long"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:fuel"
    accuracy_decimals: 1
    pid: "07"
    formula: "(a-128)*100/128"
    update_interval: "15s"
  - key: "intake_map"
    device_class: "pressure"
    unit: "kPa"
    state_class: "measurement"
    icon: "mdi:turbocharger"
    accuracy_decimals: 0
    pid: "0B"
    formula: "a"
    update_interval: "1s"
  - key: "barometric_pressure"
    device_class: "pressure"
    unit: "kPa"
    state_class: "measurement"
    icon: "mdi:weather-partly-cloudy"
    accuracy_decimals: 0
    pid: "33"
    formula: "a"
    update_interval: "30s"
  - key: "oil_temp"
    device_class: "temperature"
    unit: "°C"
    state_class: "measurement"
    icon: "mdi:oil-temperature"
    accuracy_decimals: 1
    pid: "5C"
    formula: "a-40"
    update_interval: "10s"
  - key: "fuel_rail_pressure"
    device_class: "pressure"
    unit: "kPa"
    state_class: "measurement"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    pid: "23"
    formula: "(a*256+b)*10"
    update_interval: "2s"
  - key: "timing_advance"
    unit: "°"
    state_class: "measurement"
    icon: "mdi:angle-acute"
    accuracy_decimals: 1
    pid: "0E"
    formula: "a/2-64"
    update_interval: "2s"
  - key: "pedal_position"
    unit: "%"
    state_class: "measurement"
    icon: "mdi:foot-print"
    accuracy_decimals: 1
    pid: "49"
    formula: "a/2.55"
    update_interval: "1s"
  - key: "distance_since_dtc_clear"
    device_class: "distance"
    unit: "km"
    state_class: "total_increasing"
    icon: "mdi:map-marker-distance"
    accuracy_decimals: 0
    pid: "31"
    formula: "a*256+b"
    update_interval: "30s"
  - key: "trouble_codes"
    unit: "DTCs"
    state_class: "measurement"
    icon: "mdi:alert-circle"
    accuracy_decimals: 0
    pid: "01"
    formula: "a - 128 * (a >= 128)"
    update_interval: "31s"
